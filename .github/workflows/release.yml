name: release

# Builds a self-contained Windows x64 binary on a clean GitHub runner when a version tag is pushed,
# and publishes it as a GitHub Release together with a SHA-256 checksum.
# No debug symbols (.pdb) are produced and source paths are normalised (ContinuousIntegrationBuild).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: >
          dotnet publish src/Manctl.Server/Manctl.Server.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -p:DebugSymbols=false
          -p:ContinuousIntegrationBuild=true -p:Deterministic=true
          -o out

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "manctl-$tag-win-x64.zip"
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item out/Manctl.Server.exe, LICENSE, README.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          $notes = @"
          manctl $tag - MCP server for controlling a real Windows PC and Android devices.

          **Download:** ``$zip`` (self-contained, Windows x64, no .NET install needed).
          **SHA-256:** ``$hash``

          Built by GitHub Actions from the tagged source; no debug symbols are included.
          The binary is not code-signed, so Windows SmartScreen may warn on first run.
          manctl controls the real mouse, keyboard and programs of the PC it runs on - read the Security section of the README before use.
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag "manctl-$tag-win-x64.zip" "manctl-$tag-win-x64.zip.sha256" --title "manctl $tag" --notes-file release-notes.md
